<style>
/* ============================================================= */
/*  TOKENS                                                        */
/* ============================================================= */
:root{
  --bg:#0F0F10;
  --surface:#181819;
  --surface-2:#212224;
  --line:#2B2C2F;
  --line-soft:#1F2022;
  --text:#F1F1F2;
  --muted:#9A9CA3;
  --muted-2:#6C6E75;
  --hot:#FF5330;
  --hot-2:#FF8A3D;
  --pill-bg:#26272A;

  --maxw:1180px;
  --radius:14px;
  --ease:cubic-bezier(.22,.8,.24,1);

  --f:"Archivo", system-ui, -apple-system, sans-serif;
}

:root[data-theme="light"]{
  --bg:#F6F5F3;
  --surface:#FFFFFF;
  --surface-2:#EFEEEC;
  --line:#E2E0DC;
  --line-soft:#EAE8E4;
  --text:#17181A;
  --muted:#5B5D63;
  --muted-2:#84868C;
  --pill-bg:#EDEBE7;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto;}}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--f);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .25s var(--ease), color .25s var(--ease);
}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
button{font-family:inherit;}
::selection{background:var(--hot);color:#fff;}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}

/* reveal-on-scroll */
[data-reveal]{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
[data-reveal].in-view{opacity:1;transform:none;}
@media (prefers-reduced-motion: reduce){
  [data-reveal]{opacity:1;transform:none;transition:none;}
}

/* ============================================================= */
/*  TOP BAR                                                       */
/* ============================================================= */
.topbar{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{
  display:flex;align-items:center;justify-content:space-between;
  height:60px;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:15px;white-space:nowrap;}
.brand-icon{
  width:26px;height:26px;border-radius:8px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-icon svg{width:15px;height:15px;}
.topnav{display:flex;align-items:center;gap:4px;}
.topnav a{
  font-size:13px;font-weight:500;color:var(--muted);padding:7px 12px;border-radius:8px;
  transition:color .2s,background .2s;
}
.topnav a:hover,.topnav a:focus-visible{color:var(--text);background:var(--surface-2);}
.topbar-links{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);}
.topbar-links a{transition:color .2s;}
.topbar-links a:hover,.topbar-links a:focus-visible{color:var(--text);}
.topbar-sep{color:var(--line);}
.theme-toggle{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);
  transition:border-color .2s,color .2s,transform .2s var(--ease);
}
.theme-toggle:hover{color:var(--text);border-color:var(--muted-2);}
.theme-toggle:active{transform:scale(.9);}
.theme-toggle svg{width:16px;height:16px;}

/* ============================================================= */
/*  STATS BANNER                                                  */
/* ============================================================= */
.stats-banner{
  background:linear-gradient(90deg,var(--hot),var(--hot-2));
  color:#fff;text-align:center;padding:10px 16px;font-size:13.5px;font-weight:700;letter-spacing:.01em;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.stats-banner .dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:pulse 2.4s infinite;flex-shrink:0;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55);}70%{box-shadow:0 0 0 7px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
@media (prefers-reduced-motion: reduce){.stats-banner .dot{animation:none;}}

/* ============================================================= */
/*  PROFILE                                                       */
/* ============================================================= */
.profile{padding:52px 0 34px;}
.profile-row{display:flex;gap:24px;align-items:flex-start;}
.avatar{
  width:84px;height:84px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--hot),var(--hot-2));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:28px;color:#fff;letter-spacing:-.02em;
}
.profile-name{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.15;}
.profile-handle{margin-top:4px;font-size:14.5px;color:var(--muted);font-weight:500;}
.profile-bio{margin-top:12px;font-size:15.5px;color:var(--muted);max-width:600px;line-height:1.6;}
.profile-bio strong{color:var(--text);font-weight:600;}

/* ============================================================= */
/*  TABS + SORT                                                   */
/* ============================================================= */
.controls{
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  background:var(--surface);
}
.controls-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{
  font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;color:var(--muted);
  background:transparent;border:1px solid var(--line);cursor:pointer;transition:all .2s var(--ease);
}
.tab:hover{color:var(--text);border-color:var(--muted-2);}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.sortbar{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;}
.sortbtn{
  font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:7px;color:var(--muted);
  background:transparent;border:0;cursor:pointer;transition:all .2s var(--ease);
}
.sortbtn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2);}

/* ============================================================= */
/*  SECTIONS                                                      */
/* ============================================================= */
section[id]{scroll-margin-top:64px;}
.block{padding:56px 0;}
.block-head{margin-bottom:6px;}
.block-title{font-size:clamp(20px,3vw,26px);font-weight:800;letter-spacing:-.01em;}
.block-sub{font-size:13px;color:var(--muted);margin-top:4px;}

/* WORK GRID */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px 16px;margin-top:28px;
  transition:opacity .22s var(--ease);
}
.grid.is-filtering{opacity:0;}
.card{display:flex;flex-direction:column;}
.thumb{
  position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);width:100%;
  transition:transform .18s var(--ease),border-color .2s;
}
.thumb:hover,.thumb:focus-visible{transform:translateY(-4px);border-color:var(--muted-2);outline:none;}
.thumb:focus-visible{box-shadow:0 0 0 2px var(--hot);}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s var(--ease),filter .25s;}
.thumb:hover img{transform:scale(1.05);filter:brightness(.72);}
.thumb .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 40%);}
.thumb .play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
  width:44px;height:44px;border-radius:50%;background:rgba(15,15,16,.55);border:2px solid rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s,transform .2s var(--ease);
}
.thumb:hover .play,.thumb:focus-visible .play{opacity:1;transform:translate(-50%,-50%) scale(1);}
.thumb .play::after{content:"";border-style:solid;border-width:7px 0 7px 12px;border-color:transparent transparent transparent #fff;margin-left:3px;}
.thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:4;}
.card-info{margin-top:10px;}
.card-title{font-size:13.5px;font-weight:600;line-height:1.35;}
.card-meta{margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.role-tag{
  font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--text);background:var(--pill-bg);
  padding:3px 8px;border-radius:6px;
}

/* FIT */
.fit-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:44px;align-items:start;}
.fit-copy p{font-size:clamp(15px,1.6vw,17px);color:var(--muted);line-height:1.65;margin-top:14px;}
.fit-copy p:first-child{margin-top:0;}
.fit-copy p strong{color:var(--text);font-weight:600;}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;}
.tool{
  font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);
}
.tool.key{border-color:var(--hot);color:var(--hot);}
.tools-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:14px;}

/* CONTACT */
.contact{border-top:1px solid var(--line-soft);}
.contact-grid{display:flex;flex-wrap:wrap;gap:14px;margin-top:24px;}
.contact-link{
  display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);flex:1 1 220px;transition:border-color .2s,background .2s,transform .15s var(--ease);
}
.contact-link:hover,.contact-link:focus-visible{border-color:var(--muted);background:var(--surface-2);transform:translateY(-2px);outline:none;}
.contact-link .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.contact-link .v{font-size:14.5px;color:var(--text);font-weight:600;word-break:break-all;margin-top:2px;}
.reloc{margin-top:24px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px;}
.reloc .dot{width:7px;height:7px;border-radius:50%;background:#7CD98A;flex-shrink:0;}

footer{padding:36px 0 56px;color:var(--muted-2);font-size:12px;}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:22px;}

/* ============================================================= */
/*  RESPONSIVE                                                    */
/* ============================================================= */
@media (max-width:820px){
  .fit-grid{grid-template-columns:1fr;gap:30px;}
  .topnav{display:none;}
  .profile-row{gap:16px;}
  .avatar{width:64px;height:64px;font-size:22px;}
}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:16px 12px;}
  .block{padding:44px 0;}
  .profile{padding:38px 0 26px;}
  .controls-inner{padding:12px 0;}
  .topbar-inner{height:auto;padding:10px 0;flex-wrap:wrap;row-gap:8px;}
  #hdrEmail,.topbar-links .topbar-sep{display:none;}
}
</style>

/*  RENDER  (you shouldn't need to touch anything below)             */
/* ================================================================= */
const $ = (s, r=document) => r.querySelector(s);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const md = s => (s||"").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");

// Brand + footer + title
$("#brandName").textContent = CONFIG.name;
$("#footL").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;
document.title = CONFIG.name + " — Vertical Video Editor";

// Header quick links
(function renderHeaderLinks(){
  const e = $("#hdrEmail");
  if(CONFIG.email && !CONFIG.email.includes("example.com")){
    e.textContent = CONFIG.email;
    e.href = "mailto:" + CONFIG.email;
  } else { e.style.display = "none"; }
  const l = $("#hdrLinkedin");
  if(CONFIG.linkedin && !CONFIG.linkedin.includes("REPLACE")){
    l.href = CONFIG.linkedin;
  } else { l.style.display = "none"; document.querySelectorAll(".topbar-sep")[0].style.display="none"; }
})();

// Theme toggle (persisted)
(function theme(){
  const root = document.documentElement;
  const saved = localStorage.getItem("theme");
  if(saved) root.setAttribute("data-theme", saved);
  function sync(){
    const isLight = root.getAttribute("data-theme") === "light";
    $("#themeIconMoon").style.display = isLight ? "block" : "none";
    $("#themeIconSun").style.display = isLight ? "none" : "block";
  }
  sync();
  $("#themeToggle").addEventListener("click", ()=>{
    const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    if(next === "light") root.setAttribute("data-theme","light"); else root.removeAttribute("data-theme");
    localStorage.setItem("theme", next);
    sync();
  });
})();

// Profile block
(function renderProfile(){
  $("#avatarInitials").textContent = CONFIG.brandInitials || "JR";
  $("#profileName").textContent = CONFIG.name;
  $("#profileHandle").textContent = CONFIG.handle;
  $("#profileBio").innerHTML = md(CONFIG.bio);
})();

// Stats banner — count-up animation, triggered once in view
(function renderStats(){
  $("#statsSuffix").textContent = CONFIG.statsSuffix;
  const el = $("#statsCount");
  const target = CONFIG.statsValue;
  if(reduceMotion){ el.textContent = target; return; }
  let started = false;
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting && !started){
        started = true;
        const dur = 1100, start = performance.now();
        function tick(now){
          const p = Math.min(1, (now-start)/dur);
          const eased = 1 - Math.pow(1-p, 3);
          el.textContent = Math.round(eased * target);
          if(p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        obs.disconnect();
      }
    });
  });
  obs.observe(el);
})();

// View-count parsing for sort ("12.4M" / "820K" / "1.2B" -> number)
function parseViews(v){
  if(!v) return -1;
  const m = String(v).trim().match(/^([\d.]+)\s*([KMB]?)$/i);
  if(!m) return -1;
  const n = parseFloat(m[1]);
  const mult = { "":1, K:1e3, M:1e6, B:1e9 }[m[2].toUpperCase()] || 1;
  return n * mult;
}

let activeCreator = "All";
let activeSort = "views";

// Tabs — built from whichever creators are actually tagged on videos
(function renderTabs(){
  const set = [...new Set(CONFIG.videos.map(v=>v.creator).filter(Boolean))];
  const tabsEl = $("#tabs");
  const names = ["All", ...set];
  names.forEach(name=>{
    const b = document.createElement("button");
    b.className = "tab" + (name==="All" ? " active" : "");
    b.textContent = name;
    b.addEventListener("click", ()=>{
      activeCreator = name;
      [...tabsEl.children].forEach(c=>c.classList.toggle("active", c===b));
      renderWork();
    });
    tabsEl.appendChild(b);
  });
  if(set.length === 0) tabsEl.style.display = "none";
})();

// Sort bar
(function renderSort(){
  const bar = $("#sortbar");
  [...bar.children].forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeSort = btn.dataset.sort;
      [...bar.children].forEach(c=>c.classList.toggle("active", c===btn));
      renderWork();
    });
  });
})();

// Work grid — lazy YouTube facades (fast load, embed only on click)
function renderWork(){
  const grid = $("#workGrid");
  const doFade = !reduceMotion && grid.children.length > 0;
  const build = () => {
    grid.innerHTML = "";
    let list = CONFIG.videos.filter(v => activeCreator === "All" || v.creator === activeCreator);
    if(activeSort === "views") list = [...list].sort((a,b)=> parseViews(b.views) - parseViews(a.views));
    else if(activeSort === "newest") list = [...list].sort((a,b)=> (b.date||"").localeCompare(a.date||""));
    else if(activeSort === "oldest") list = [...list].sort((a,b)=> (a.date||"").localeCompare(b.date||""));

    $("#workMeta").textContent = list.length + " vertical edit" + (list.length===1?"":"s") + " · click to play";

    list.forEach((v,i)=>{
      const card = document.createElement("div");
      card.className = "card";
      const num = String(i+1).padStart(2,"0");
      const title = v.title || ("Edit " + num);
      const metaBits = [];
      if(v.role) metaBits.push('<span class="role-tag">'+v.role+'</span>');
      if(v.views) metaBits.push('<span>'+v.views+' views</span>');

      const thumb = document.createElement("button");
      thumb.className = "thumb";
      thumb.type = "button";
      thumb.setAttribute("aria-label", "Play " + title);
      thumb.innerHTML =
        '<img src="https://i.ytimg.com/vi/'+v.id+'/maxresdefault.jpg" ' +
          'onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg\'" ' +
          'alt="'+title+'" loading="lazy">' +
        '<div class="overlay"></div>' +
        '<span class="play"></span>';
      thumb.addEventListener("click", ()=>{
        thumb.innerHTML =
          '<iframe src="https://www.youtube-nocookie.com/embed/'+v.id+
          '?autoplay=1&playsinline=1&rel=0&modestbranding=1" ' +
          'allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="'+title+'"></iframe>';
      }, { once:true });

      card.appendChild(thumb);
      const info = document.createElement("div");
      info.className = "card-info";
      info.innerHTML = '<div class="card-title">'+title+'</div>' + (metaBits.length ? '<div class="card-meta">'+metaBits.join("")+'</div>' : '');
      card.appendChild(info);
      grid.appendChild(card);
    });
  };
  if(doFade){
    grid.classList.add("is-filtering");
    setTimeout(()=>{ build(); grid.classList.remove("is-filtering"); }, 180);
  } else {
    build();
  }
}
renderWork();

// Fit copy + tools
(function renderFit(){
  const c = $("#fitCopy");
  CONFIG.fit.forEach(p=>{
    const el = document.createElement("p");
    el.innerHTML = md(p);
    c.appendChild(el);
  });
  const t = $("#tools");
  CONFIG.tools.forEach(tool=>{
    const el = document.createElement("span");
    el.className = "tool" + (tool.key ? " key" : "");
    el.textContent = tool.name;
    t.appendChild(el);
  });
})();

// Contact tiles
(function renderContact(){
  const grid = $("#contactGrid");
  const tiles = [
    { k:"Email", v:CONFIG.email, href:"mailto:"+CONFIG.email, show:CONFIG.email && !CONFIG.email.includes("example.com") },
    { k:"LinkedIn", v:"View profile", href:CONFIG.linkedin, show:CONFIG.linkedin && !CONFIG.linkedin.includes("REPLACE") },
    { k:"YouTube", v:"Channel", href:CONFIG.youtube, show:!!CONFIG.youtube },
    { k:"Résumé", v:"Download PDF", href:CONFIG.resume, show:!!CONFIG.resume }
  ];
  tiles.forEach(t=>{
    if(!t.show) return;
    const a = document.createElement("a");
    a.className = "contact-link";
    a.href = t.href;
    if(t.k!=="Email") { a.target="_blank"; a.rel="noopener"; }
    a.innerHTML = '<span><span class="k">'+t.k+'</span><br><span class="v">'+t.v+'</span></span>';
    grid.appendChild(a);
  });
  $("#relocLine").textContent = CONFIG.relocation;
})();

// Scroll-reveal
(function reveal(){
  const els = [...document.querySelectorAll("[data-reveal]")];
  if(reduceMotion){ els.forEach(e=>e.classList.add("in-view")); return; }
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){ en.target.classList.add("in-view"); obs.unobserve(en.target); }
    });
  }, { threshold: 0.12 });
  els.forEach(e=>obs.observe(e));
})();

// Work grid cards also get a staggered reveal each time they render
(function observeGridReveal(){
  const grid = $("#workGrid");
  const mo = new MutationObserver(()=>{
    if(reduceMotion) return;
    [...grid.children].forEach((card,i)=>{
      card.style.opacity = "0";
      card.style.transform = "translateY(14px)";
      card.style.transition = "opacity .4s var(--ease), transform .4s var(--ease)";
      card.style.transitionDelay = Math.min(i*0.035, 0.4) + "s";
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        card.style.opacity = "1";
        card.style.transform = "none";
      }));
    });
  });
  mo.observe(grid, { childList:true });
})();
</script>
